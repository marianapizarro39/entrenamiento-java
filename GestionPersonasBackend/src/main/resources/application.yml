spring:
    application:
        name: personas
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
    jpa:
        show-sql: true
        properties:
            hibernate:
                "[format_sql]": true
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true

server:
    port: 8080
